  <div class="container">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <form class="well form-horizontal" action="https://script.google.com/macros/s/AKfycbyU_7iR1i0zuTtt9Io8GuzIvKoJHuADAvoorWOfLQxd776lLCFhMBMkk6tsoJFIkqP6/exec" method="post" id="form">
        <fieldset>
            <!-- Form Name -->
            <legend>Become Part of the MTC ENET'Com Family</legend>

            <!-- Text input-->
            <div class="form-group">
                <label class="col-md-4 control-label">First Name</label>  
                <div class="col-md-4 inputGroupContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input name="first_name" placeholder="First Name" class="form-control" type="text" required>
                    </div>
                </div>
            </div>

            <!-- Text input-->
            <div class="form-group">
                <label class="col-md-4 control-label">Last Name</label> 
                <div class="col-md-4 inputGroupContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                        <input name="last_name" placeholder="Last Name" class="form-control" type="text" required>
                    </div>
                </div>
            </div>

            <!-- Text input-->
            <div class="form-group">
                <label class="col-md-4 control-label">E-Mail</label>  
                <div class="col-md-4 inputGroupContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-envelope"></i></span>
                        <input name="email" placeholder="E-Mail Address" class="form-control" type="email" required>
                    </div>
                </div>
            </div>

            <!-- Text input-->
            <div class="form-group">
                <label class="col-md-4 control-label">Phone #</label>  
                <div class="col-md-4 inputGroupContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-earphone"></i></span>
                        <input name="phone" placeholder="(+216)12 345 678" class="form-control" type="tel" required>
                    </div>
                </div>
            </div>

            <!-- Field Selection -->
            <div class="form-group"> 
                <label class="col-md-4 control-label">Field</label>
                <div class="col-md-4 selectContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-list"></i></span>
                        <select name="field" class="form-control selectpicker" required>
                            <option value="" disabled selected>Please select your field</option>
                            <option>GII</option>
                            <option>GT</option>
                            <option>IDSD</option>
                            <option>GEC</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Year of Study -->
            <div class="form-group"> 
                <label class="col-md-4 control-label">Year of Study</label>
                <div class="col-md-4 selectContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-list"></i></span>
                        <select name="year_of_study" class="form-control selectpicker" required>
                            <option value="" disabled selected>Please select your year of study</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Facebook -->
            <div class="form-group">
                <label class="col-md-4 control-label">Facebook</label>  
                <div class="col-md-4 inputGroupContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-globe"></i></span>
                        <input name="facebook" placeholder="Facebook name or path" class="form-control" type="text">
                    </div>
                </div>
            </div>

            <!-- Radio Buttons -->
            <div class="form-group">
                <label class="col-md-4 control-label">Which activities are you most excited about?</label>
                <div class="col-md-4">
                    <div class="radio">
                        <label>
                            <input type="radio" name="activities" value="Workshops" /> Workshops
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="activities" value="Training Sessions" /> Training Sessions
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="activities" value="Hackathons" /> Hackathons 
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="activities" value="Team Building and Social Events" /> Team Building and Social Events
                        </label>
                    </div>
                </div>
            </div>

            <!-- Text Area -->
            <div class="form-group">
                <label class="col-md-4 control-label">Leave a message</label>
                <div class="col-md-4 inputGroupContainer">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="glyphicon glyphicon-pencil"></i></span>
                        <textarea class="form-control" name="message" placeholder="Project Description"></textarea>
                    </div>
                </div>
            </div>

            <!-- Success Message -->
            <div class="alert alert-success" role="alert" id="success_message">Success <i class="glyphicon glyphicon-thumbs-up"></i> Thanks for contacting us, we will get back to you shortly.</div>

            <!-- Button -->
            <div class="form-group">
                <label class="col-md-4 control-label"></label>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-warning">Send <span class="glyphicon glyphicon-send"></span></button>
                </div>
            </div>
        </fieldset>
    </form>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
