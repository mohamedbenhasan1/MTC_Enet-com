<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Ticket</title>
  <style>
    body {
      background: #f2f2f2;
      font-family: "Questrial", sans-serif;
    }

    aside.context {
      text-align: center;
      color: #333;
      line-height: 1.7;
    }

    aside.context a {
      text-decoration: none;
      color: #333;
      padding: 3px 0;
      border-bottom: 1px dashed;
    }

    aside.context a:hover {
      border-bottom: 1px solid;
    }

    .main-content {
      margin: 4em auto 0;
      width: 740px;
      text-transform: uppercase;
    }

    .ticket {
      display: grid;
      grid-template-columns: auto 143px;
      background: #f3f1c9;
      border-radius: 10px;
      border: 2px solid #222;
      cursor: default;
    }

    .ticket__main {
      display: grid;
      grid-template-columns: repeat(6, 1fr) 120px;
      grid-template-rows: repeat(4, min-content) auto;
      padding: 10px;
    }

    .header {
      grid-column: span 7;
      font: 900 38px "Montserrat", sans-serif;
      padding: 5px 0 5px 20px;
      background: #111;
      color: #f3f1c9;
    }

    .info {
      border: 3px solid;
      border-width: 0 3px 3px 0;
      padding: 8px;
    }

    .info__item {
      font: 400 13px "Questrial", sans-serif;
      letter-spacing: 0.5px;
    }

    .info__detail {
      font: 700 20px/1 "Jura";
      margin: 4px 0;
    }

    .passenger {
      grid-column: 1/span 6;
    }

    .platform {
      grid-column: 7/span 1;
      background: #c02a28;
      color: #fff;
      text-align: center;
      padding: 10px 0;
    }

    .departure,
    .arrival {
      grid-column-start: span 3;
    }

    .date,
    .time {
      grid-column-start: span 2;
    }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <p>TICKET GENERATOR</p>
  </div>

  <form method="post" action="/ticket">
    {% csrf_token %}
    <input type="text" name="start_station" placeholder="Enter Code of Starting Station" required />
    <input type="text" name="leaving_station" placeholder="Enter Code of Leaving Station" required />
    <input type="text" name="name" placeholder="Enter Name" required />
    <input type="text" name="coach" placeholder="Enter Coach" required />
    <input type="text" name="seat_number" placeholder="Enter Seat Number" required />
    <input type="date" name="date" required />
    <input type="time" name="time" required />

    <button type="submit" class="submit">Submit</button>
  </form>

  <div class="main-content">
    <div class="ticket">
      <div class="ticket__main">
        <div class="header">Hogwarts Express</div>
        <div class="info passenger">
          <div class="info__item">Passenger</div>
          <div class="info__detail">{{ name }}</div>
        </div>
        <div class="info platform">
          <span>Depart</span><span>from</span><span>platform</span>
          <div class="number">
            <div>9</div>
            <div><span>3</span><span>4</span></div>
          </div>
        </div>
        <div class="info departure">
          <div class="info__item">Depart</div>
          <div class="info__detail">{{ start_station }}</div>
        </div>
        <div class="info arrival">
          <div class="info__item">Arrival</div>
          <div class="info__detail">{{ leaving_station }}</div>
        </div>
        <div class="info date">
          <div class="info__item">Date</div>
          <div class="info__detail">{{ date }}</div>
        </div>
        <div class="info time">
          <div class="info__item">Time</div>
          <div class="info__detail">{{ time }}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
